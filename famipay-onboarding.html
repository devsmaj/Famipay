<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#087052">
    <title>Complete your FAMIPAY account</title>
    <link rel="stylesheet" href="assets/css/famipay-app.css">
    <link rel="stylesheet" href="assets/css/famipay-loading.css">
    <link rel="stylesheet" href="assets/css/famipay-onboarding.css">
</head>
<body class="fp-app fp-onboarding-page">
    <main class="fp-onboarding-shell">
        <header class="fp-onboarding-header">
            <button id="onboarding-back" class="fp-onboarding-back" type="button" aria-label="Back" data-i18n-aria-label="onboarding.back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path>
                </svg>
            </button>
            <a class="fp-onboarding-brand" href="index.html" aria-label="FAMIPAY">
                <img src="assets/branding/famipay-logo.svg" alt="FAMIPAY" width="144" height="38">
            </a>
            <a class="fp-onboarding-help" href="contact.html" data-i18n="onboarding.help">Help</a>
        </header>
        <section class="fp-onboarding-content" aria-label="Account setup" data-i18n-aria-label="onboarding.title">
            <div class="fp-onboarding-progress-wrap">
                <ol class="fp-onboarding-progress" aria-label="Account setup progress" data-i18n-aria-label="onboarding.progress">
                <li data-onboarding-step="verify">
                    <span class="fp-step-index" aria-hidden="true">1</span><span class="fp-step-label" data-i18n="onboarding.verify">Verify</span>
                </li>
                <li data-onboarding-step="profile">
                    <span class="fp-step-index" aria-hidden="true">2</span><span class="fp-step-label" data-i18n="onboarding.profile">Profile</span>
                </li>
                <li data-onboarding-step="pin">
                    <span class="fp-step-index" aria-hidden="true">3</span><span class="fp-step-label" data-i18n="onboarding.pin">Secure PIN</span>
                </li>
                <li data-onboarding-step="ready">
                    <span class="fp-step-index" aria-hidden="true">4</span><span class="fp-step-label" data-i18n="onboarding.ready">Ready</span>
                </li>
                </ol>
                <div class="fp-onboarding-progress-track" aria-hidden="true">
                    <span id="onboarding-progress-bar"></span>
                </div>
            </div>

            <section id="verify-step" class="fp-onboarding-step" hidden aria-labelledby="verify-title">
                <div class="fp-onboarding-step-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 5h16v14H4z"></path><path d="m4 7 8 6 8-6"></path><path d="m9 17 2 2 4-4"></path>
                    </svg>
                </div>
                <h2 id="verify-title" data-i18n="onboarding.verify_title">Verify your account</h2>
                <div id="verification-state" class="fp-onboarding-inline-state" role="status" aria-live="polite" hidden>
                    <span data-i18n="onboarding.checking">Verifying your account…</span>
                </div>
                <div class="fp-onboarding-actions">
                    <button id="retry-verification" class="fp-onboarding-button fp-onboarding-button-secondary" type="button" data-i18n="onboarding.retry" hidden>Retry</button>
                </div>
            </section>

            <section id="profile-step" class="fp-onboarding-step" hidden aria-labelledby="profile-title">
                <div class="fp-onboarding-step-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>
                    </svg>
                </div>
                <h2 id="profile-title" data-i18n="onboarding.profile_title">Complete your profile</h2>
                <form id="profile-form">
                    <label class="fp-onboarding-label" for="profile-first-name" data-i18n="onboarding.first_name">First name</label>
                    <input id="profile-first-name" name="firstName" autocomplete="given-name" maxlength="80" required>
                    <label class="fp-onboarding-label" for="profile-last-name" data-i18n="onboarding.last_name">Last name</label>
                    <input id="profile-last-name" name="lastName" autocomplete="family-name" maxlength="80" required>
                    <label class="fp-onboarding-label" for="profile-phone" data-i18n="onboarding.phone">Phone number</label>
                    <div class="fp-onboarding-phone-field" dir="ltr">
                        <span id="profile-phone-flag" aria-hidden="true">🇹🇩</span>
                        <input id="profile-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" value="+235 " maxlength="25" aria-describedby="profile-phone-help" required>
                    </div>
                    <span id="profile-phone-help" class="fp-onboarding-phone-help" data-i18n="onboarding.phone_help">Include the international country code.</span>
                    <div class="fp-onboarding-actions">
                        <button class="fp-onboarding-button" type="submit" data-i18n="onboarding.continue">Save &amp; Continue</button>
                    </div>
                </form>
            </section>

            <section id="pin-step" class="fp-onboarding-step" hidden aria-labelledby="pin-title">
                <div class="fp-onboarding-step-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 1 1 8 0v3"></path><path d="M12 14v3"></path>
                    </svg>
                </div>
                <h2 id="pin-title" data-i18n="onboarding.pin_title">Set your secure PIN</h2>
                <form id="pin-form">
                    <label class="fp-onboarding-label" for="account-pin" data-i18n="onboarding.pin_label">Secure PIN</label>
                    <input id="account-pin" name="pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
                    <label class="fp-onboarding-label" for="confirm-pin" data-i18n="onboarding.confirm_pin">Confirm PIN</label>
                    <input id="confirm-pin" name="confirmPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
                    <div class="fp-onboarding-actions">
                        <button class="fp-onboarding-button" type="submit" data-i18n="onboarding.save_pin">Save PIN securely</button>
                    </div>
                </form>
            </section>

            <section id="ready-step" class="fp-onboarding-step" hidden aria-labelledby="ready-title">
                <div class="fp-onboarding-step-icon fp-onboarding-success-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m5 12 4 4L19 6"></path>
                    </svg>
                </div>
                <h2 id="ready-title" data-i18n="onboarding.ready_title">Your account is ready</h2>
                <p data-i18n="onboarding.ready_message">Your verified profile is complete. Welcome to FAMIPAY.</p>
                <button id="open-home" class="fp-onboarding-button" type="button" data-i18n="onboarding.home">Open FAMIPAY</button>
            </section>

            <div id="onboarding-error" class="fp-onboarding-error" role="alert" hidden>
                <p id="onboarding-error-text"></p>
                <button id="retry-onboarding" class="fp-onboarding-button fp-onboarding-button-secondary" type="button" data-i18n="onboarding.retry">Retry</button>
            </div>
        </section>
    </main>
    <script src="assets/js/loading.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/session.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/vendor/supabase.js"></script>
    <script src="assets/vendor/libphonenumber-max.js"></script>
    <script src="assets/js/platform.js"></script>
    <script src="assets/js/famipay-navigation.js"></script>
    <script src="assets/locales/catalog.js"></script>
    <script>
        try {
            const language = window.FaminaSession?.getPreference('language') || localStorage.getItem('language');
            window.FAMIPAY_PRIVATE_LANGUAGE = ['en', 'fr-TD', 'ar-TD'].includes(language) ? language : null;
        } catch (_) {}
    </script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/famipay-onboarding.js"></script>
</body>
</html>
