<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - FAMIPAY</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
    <link rel="stylesheet" href="assets/css/platform.css">
    <link rel="stylesheet" href="assets/css/cart-page.css">
    <script>document.documentElement.classList.add('page-loading', 'header-loading');</script>
    <link rel="stylesheet" href="assets/css/loading.css">
    <link rel="stylesheet" href="assets/css/famipay-home.css?v=2">
    <link rel="stylesheet" href="assets/css/famipay-public.css?v=2">
</head>
<body class="customer-fullscreen home-page cart-page">
    <div id="header"></div>

    <main>
        <section class="cart-section">
            <div class="container">
                <a class="cart-back-link" href="restaurant.html">← Browse restaurants</a>
                <h1 data-i18n="cart.title">Your Cart</h1>
                <p class="cart-page-intro">A little closer to your next favorite meal.</p>
                <div class="cart-page-layout">
                <div id="cart-items" class="cart-items">
                    <!-- Cart items will be populated by JavaScript -->
                </div>
                <aside class="cart-summary" id="cart-summary" hidden aria-label="Order summary">
                <h2>Order summary</h2>
                <div id="cart-total" class="cart-total">
                    <!-- Total will be calculated by JavaScript -->
                </div>
                <p class="cart-fee-note">Delivery charges are calculated at checkout.</p>
                <a id="cart-checkout" href="checkout.html" class="checkout-btn" data-i18n="cart.checkout" hidden>Proceed to Checkout</a>
                </aside>
                </div>
            </div>
        </section>
    </main>
    <div id="footer"></div>



    <script src="assets/js/loading.js" onerror="document.documentElement.classList.remove('page-loading', 'header-loading')"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/session.js"></script>
    <script src="assets/locales/catalog.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/frontend-api.js"></script>
    <script src="assets/vendor/supabase.js"></script>
    <script src="assets/js/platform.js"></script>
    <script src="assets/js/cart-state.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/cart.js"></script>

</body>
</html>
