<body class="auth-page customer-fullscreen" data-auth-page="login">
    <main class="auth-scene">
        <video class="auth-video" data-src="https://assets.mixkit.co/videos/4385/4385-1080.mp4" poster="https://assets.mixkit.co/videos/4385/4385-thumb-720-0.jpg" muted loop playsinline preload="none" aria-hidden="true" tabindex="-1"></video>
        <div class="auth-shade" aria-hidden="true"></div>
        <div class="auth-layout">
            <section class="form-section auth-card">
            <div class="container">
                <h2 class="smaj" data-i18n="auth.login_title">Login to Your Account</h2>

                <section id="firebase-auth" class="social-auth" aria-label="Email or phone authentication">
                    <p class="auth-intro" data-i18n="auth.subtitle">Your next delicious moment starts here.</p>
                    <form id="phone-form">
                        <div class="auth-method-options" role="group" aria-label="Choose sign-in method">
                            <button id="auth-use-email" type="button" data-auth-method="email" aria-pressed="true" data-i18n="auth.use_email">Email</button>
                            <button id="auth-use-phone" type="button" data-auth-method="phone" aria-pressed="false" data-i18n="auth.use_phone">Phone</button>
                        </div>
                        <div id="auth-email-group" class="form-group" data-auth-identifier="email">
                            <label for="auth-email" data-i18n="auth.email_label">Email address</label>
                            <input id="auth-email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
                        </div>
                        <div id="auth-phone-group" class="form-group" data-auth-identifier="phone" hidden>
                            <label for="auth-phone" data-i18n="auth.phone_label">Chad phone number (+235)</label>
                            <div class="auth-phone-field" dir="ltr"><span class="auth-phone-prefix" aria-label="Chad, +235"><svg viewBox="0 0 30 20" aria-hidden="true" focusable="false"><path fill="#002664" d="M0 0h10v20H0z"/><path fill="#FECB00" d="M10 0h10v20H10z"/><path fill="#C60C30" d="M20 0h10v20H20z"/></svg><span>+235</span></span><input id="auth-phone" type="tel" autocomplete="tel-national" placeholder="66 12 34 56" dir="ltr" inputmode="tel" maxlength="20"></div>
                        </div>
                        <p id="auth-phone-notice" class="sms-notice" data-auth-phone-notice hidden data-i18n="auth.sms_notice">A verification SMS may be sent to your phone.</p>
                        <div class="form-group"><label for="auth-password" data-i18n="auth.password">Password</label><div class="auth-password-field"><input id="auth-password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><button type="button" class="auth-password-toggle" data-password-toggle="auth-password" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M4 4 20 20"/></svg></button></div></div>
                        <button type="submit" class="submit-btn" data-i18n="auth.login">Login</button>
                        <button type="button" id="reset-password" class="auth-reset-link" data-i18n="auth.reset_password">Set or reset password</button>
                    </form>
                    <form id="phone-code-form" hidden>
                        <p class="phone-destination"><span data-i18n="auth.code_sent_to">Enter the code sent to</span> <strong id="sent-phone" dir="ltr"></strong></p>
                        <div class="form-group">
                            <label for="auth-code" data-i18n="auth.code_label">SMS verification code</label>
                            <input id="auth-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
                        </div>
                        <button type="submit" class="submit-btn" data-i18n="auth.verify">Verify and continue</button>
                        <div class="phone-actions"><button type="button" id="change-phone" data-i18n="auth.change_phone">Change number</button><button type="button" id="resend-code" data-i18n="auth.resend">Resend code</button></div>
                    </form>
                    <form id="password-reset-form" hidden>
                        <div class="form-group"><label for="reset-new-password" data-i18n="auth.password">Password</label><div class="auth-password-field"><input id="reset-new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button type="button" class="auth-password-toggle" data-password-toggle="reset-new-password" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M4 4 20 20"/></svg></button></div></div>
                        <div class="form-group"><label for="reset-confirm-password" data-i18n="auth.confirm_password">Confirm Password</label><div class="auth-password-field"><input id="reset-confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button type="button" class="auth-password-toggle" data-password-toggle="reset-confirm-password" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M4 4 20 20"/></svg></button></div></div>
                        <button type="submit" class="submit-btn" data-i18n="auth.save_password">Save password and continue</button>
                    </form>
                </section>
                <p class="auth-trust"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 8 4v5c0 5-8 9-8 9s-8-4-8-9V7z"/><path d="m8 12 3 3 5-6"/></svg><span data-i18n="auth.trust">Sign in securely with your email or phone number.</span></p>
                <p class="auth-switch"><span data-i18n="auth.no_account">Don't have an account?</span> <a href="register.html" data-i18n="auth.register_here">Register here</a></p>
            </div>
        </section>
        </div>
    </main>

</body>
</html>
