<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Verify your email · FAMIPAY</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
    <link rel="stylesheet" href="assets/css/loading.css">
    <link rel="stylesheet" href="assets/css/verify-email.css">
</head>
<body class="fp-verification-page">
    <main class="fp-verification-shell">
        <section class="fp-verification-card" aria-labelledby="verification-title">
            <a class="fp-verification-brand" href="index.html" aria-label="FAMIPAY home">
                <img src="assets/branding/famipay-logo.svg" alt="FAMIPAY" width="180" height="44">
            </a>
            <div class="fp-verification-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="m3 7 9 6 9-6"></path>
                    <path d="m8 16 2 2 5-5"></path>
                </svg>
            </div>
            <h1 id="verification-title" data-i18n="auth.verification_title">Verify Your Email</h1>
            <p class="fp-verification-intro" data-i18n="auth.verification_description">
                We've sent a 6-digit verification code to your email address.
            </p>
            <form id="verification-form" novalidate>
                <label for="verification-email" data-i18n="auth.email_label">Email address</label>
                <input id="verification-email" type="email" inputmode="email" autocomplete="email"
                       autocapitalize="none" spellcheck="false" dir="ltr" maxlength="254" required>
                <p id="verification-destination" class="fp-verification-destination" data-no-translate></p>
                <label for="verification-code" data-i18n="auth.verification_code_label">6-digit verification code</label>
                <input id="verification-code" type="text" inputmode="numeric" autocomplete="one-time-code"
                       pattern="[0-9]{6}" maxlength="6" minlength="6" dir="ltr" required>
                <p id="verification-status" class="fp-verification-status" role="status" aria-live="polite"
                   data-i18n="auth.verification_waiting">
                    Enter the 6-digit code sent to your email.
                </p>
                <p id="resend-countdown" class="fp-verification-countdown" aria-live="polite" hidden></p>
                <div class="fp-verification-actions">
                    <button id="verify-email-button" class="fp-verification-primary" type="submit"
                            data-i18n="auth.verification_verify">
                        Verify Email
                    </button>
                    <button id="resend-verification" class="fp-verification-secondary" type="button"
                            data-i18n="auth.verification_resend">
                        Resend Code
                    </button>
                </div>
            </form>
            <div class="fp-verification-links">
                <a id="change-email" href="register.html" data-i18n="auth.verification_change_email">Change Email</a>
                <a class="fp-verification-login" href="login.html" data-i18n="auth.verification_login">Back to sign in</a>
            </div>
        </section>
    </main>
        <script src="assets/js/loading.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/session.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/locales/catalog.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/vendor/supabase.js"></script>
    <script src="assets/js/platform.js"></script>
    <script src="assets/js/verify-email.js"></script>
</body>
</html>
