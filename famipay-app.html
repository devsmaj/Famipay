<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>FAMIPAY</title>
    <link rel="stylesheet" href="assets/css/famipay-app.css">
    <link rel="stylesheet" href="assets/css/famipay-bottom-nav.css">
    <link rel="stylesheet" href="assets/css/famipay-language-settings.css">
    <link rel="stylesheet" href="assets/css/famipay-loading.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
</head>
<body class="fp-app">
    <div id="app" class="fp-bootstrap-shell" aria-busy="true">
        <div class="fp-redirect" role="status" aria-live="polite">
            <div class="fp-redirect-mark" aria-hidden="true">F</div>
            <span class="fp-redirect-spinner" aria-hidden="true"></span>
            <strong class="fp-redirect-title">Opening FAMIPAY</strong>
            <p class="fp-redirect-message">Checking your account securely…</p>
            <button class="fp-redirect-retry" type="button" hidden>Try Again</button>
        </div>
    </div>
    <script src="assets/js/loading.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/session.js"></script>
    <script src="assets/vendor/supabase.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/platform.js"></script>
    <script src="assets/js/famipay-navigation.js"></script>
    <script>
        (async function () {
            const app = document.getElementById('app');
            const mapRole = role => ({
                restaurant_owner: 'merchant',
                restaurant: 'merchant',
                seller: 'merchant',
                rider: 'rider',
                admin: 'admin',
                agent: 'agent',
            })[role] || 'customer';
            let renderedRole = null;
            const title = app.querySelector('.fp-redirect-title');
            const message = app.querySelector('.fp-redirect-message');
            const retry = app.querySelector('.fp-redirect-retry');
            const spinner = app.querySelector('.fp-redirect-spinner');
            // The redirect screen owns its single spinner; do not mount the global overlay.
            const stopLoading = () => {};
            let finished = false;
            const finish = () => { if (!finished) { finished = true; stopLoading(); } };
            const setRedirect = destination => {
                if (title) title.textContent = 'Taking you to your account';
                if (message) message.textContent = 'Opening your next page…';
                finish();
                location.replace(destination);
            };
            const showError = text => {
                finish();
                if (title) title.textContent = 'Unable to connect';
                if (message) message.textContent = text;
                if (spinner) spinner.hidden = true;
                if (retry) { retry.hidden = false; retry.onclick = () => location.reload(); }
                app.removeAttribute('aria-busy');
            };

            function renderApp(role) {
                if (renderedRole === role) return Promise.resolve();
                renderedRole = role;
                window.FAMIPAY_AUTH_ROLE = role;
                app.hidden = false;
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'assets/js/famipay-app.js';
                    script.onload = resolve;
                    script.onerror = () => {
                        renderedRole = null;
                        reject(new Error('Unable to load your account.'));
                    };
                    document.body.append(script);
                });
            }

            // Render private content only after the server verifies the restored session.
            try {
                await Promise.race([
                    window.Famina.ready,
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Account verification timed out. Check your connection and try again.')), 15000))
                ]);
                if (!window.Famina.user) {
                    setRedirect('login.html');
                    return;
                }
                if (!window.Famina.user.onboarding_complete) {
                    setRedirect('famipay-onboarding.html');
                    return;
                }

                const role = mapRole(window.Famina.user.role);
                await renderApp(role);
                finish();
                app.removeAttribute('aria-busy');
            } catch (error) {
                showError(error?.message || 'Unable to verify your session. Please try again.');
            }
        })();
    </script>
    <script src="assets/locales/catalog.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/famipay-language-settings.js" defer></script>
</body>
</html>
