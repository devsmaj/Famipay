<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>FAMIPAY Private Preview</title>
    <link rel="stylesheet" href="assets/css/famipay-app.css">
    <link rel="stylesheet" href="assets/css/famipay-bottom-nav.css">
    <link rel="stylesheet" href="assets/css/famipay-language-settings.css">
    <link rel="stylesheet" href="assets/css/famipay-loading.css">
</head>
<body class="fp-app">
    <div id="app" class="fp-bootstrap-shell">
        <div class="fp-bootstrap">
            <div class="fp-brand">FAMIPAY</div>
            <p>Your private dashboard will appear here.</p>
            <a href="login.html">Login / Sign up</a>
        </div>
    </div>
    <script src="assets/js/loading.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/session.js"></script>
    <script src="assets/vendor/supabase.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/platform.js"></script>
    <script src="assets/js/famipay-navigation.js"></script>
    <script>
        (async function () {
            const app = document.getElementById('app');
            const mapRole = role => ({
                restaurant_owner: 'merchant',
                rider: 'rider',
                admin: 'admin',
                agent: 'agent',
            })[role] || 'customer';
            let renderedRole = null;

            function renderApp(role) {
                if (renderedRole === role) return Promise.resolve();
                renderedRole = role;
                window.FAMIPAY_AUTH_ROLE = role;
                app.hidden = false;
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'assets/js/famipay-app.js';
                    script.onload = resolve;
                    script.onerror = () => {
                        renderedRole = null;
                        reject(new Error('Unable to load the preview.'));
                    };
                    document.body.append(script);
                });
            }

            const cachedUser = window.FaminaSession.user();
            const earlyRender = cachedUser?.onboarding_complete
                ? renderApp(mapRole(cachedUser.role)).catch(error => error)
                : Promise.resolve(null);

            try {
                await window.Famina.ready;
                if (!window.Famina.user) {
                    const shell = document.createElement('main');
                    shell.className = 'fp-bootstrap';
                    const brand = document.createElement('strong');
                    brand.textContent = 'FAMIPAY';
                    const message = document.createElement('p');
                    message.textContent = 'Please sign in to access FAMIPAY.';
                    const link = document.createElement('a');
                    link.href = 'login.html';
                    link.textContent = 'Login / Sign up';
                    shell.append(brand, message, link);
                    app.replaceChildren(shell);
                    return;
                }
                if (!window.Famina.user.onboarding_complete) {
                    location.replace('famipay-onboarding.html');
                    return;
                }

                const role = mapRole(window.Famina.user.role);
                const earlyError = await earlyRender;
                if (earlyError || renderedRole !== role) await renderApp(role);
            } catch (error) {
                app.hidden = false;
                const message = app.querySelector('.fp-bootstrap p');
                if (message) message.textContent = error.message === 'Unable to load the preview.'
                    ? error.message
                    : 'Unable to verify your session. Please try again.';
            }
        })();
    </script>
    <script src="assets/locales/catalog.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/famipay-language-settings.js" defer></script>
</body>
</html>
