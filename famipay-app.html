<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>FAMIPAY Private Preview</title>
    <link rel="stylesheet" href="assets/css/famipay-app.css">
    <link rel="stylesheet" href="assets/css/famipay-loading.css">
</head>
<body>
    <main id="auth-status" class="fp-loading-status" role="status" aria-label="Loading FAMIPAY">
        <span class="fp-loader-logo">FAMIPAY</span>
    </main>
    <div id="app" hidden></div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/session.js"></script>
    <script src="assets/vendor/supabase.js"></script>
    <script src="assets/js/platform.js"></script>
    <script src="assets/js/famipay-navigation.js"></script>
    <script>
        (async function () {
            const status = document.getElementById('auth-status');
            const app = document.getElementById('app');
            const mapRole = role => ({
                restaurant_owner: 'merchant',
                rider: 'rider',
                admin: 'admin',
                agent: 'agent',
            })[role] || 'customer';
            let renderedRole = null;

            function renderApp(role) {
                if (renderedRole === role) return Promise.resolve();
                renderedRole = role;
                window.FAMIPAY_AUTH_ROLE = role;
                app.replaceChildren();
                app.hidden = false;
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'assets/js/famipay-app.js';
                    script.onload = resolve;
                    script.onerror = () => {
                        renderedRole = null;
                        reject(new Error('Unable to load the preview.'));
                    };
                    document.body.append(script);
                });
            }

            const cachedUser = window.FaminaSession.user();
            const earlyRender = cachedUser
                ? renderApp(mapRole(cachedUser.role)).catch(error => error)
                : Promise.resolve(null);

            try {
                await window.Famina.ready;
                if (!window.Famina.user) {
                    app.hidden = true;
                    status.replaceChildren(document.createTextNode('Please sign in to access FAMIPAY. '));
                    const link = document.createElement('a');
                    link.href = 'login.html';
                    link.textContent = 'Login / Sign up';
                    status.append(link);
                    return;
                }

                const role = mapRole(window.Famina.user.role);
                const earlyError = await earlyRender;
                if (earlyError || renderedRole !== role) await renderApp(role);
                status.hidden = true;
            } catch (error) {
                app.hidden = true;
                status.textContent = error.message === 'Unable to load the preview.'
                    ? error.message
                    : 'Unable to verify your session. Please try again.';
            }
        })();
    </script>
    <script src="assets/js/famipay-i18n.js" defer></script>
</body>
</html>
